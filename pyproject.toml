[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jevpilot"
version = "0.1.0"
description = "Research-oriented hybrid computer use agent baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.11.0,<5.0.0",
  "browser-use==0.13.11",
  "httpx2[http2,brotli,zstd]>=2.13.0,<3.0.0",
  "jsonschema>=4.26.0",
  "playwright>=1.55.0,<2.0.0",
  "pydantic>=2.9.0,<3.0.0",
]

[project.scripts]
jevpilot = "jevpilot.app:entrypoint"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jevpilot"]

[tool.basedpyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: launches a real Chrome; run with JEVPILOT_BROWSER_TESTS=1"]

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
]
